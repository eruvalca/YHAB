name: Set up YHAB .NET
description: Install the pinned SDK, cache NuGet packages, and install Aspire.
runs:
  using: composite
  steps:
    - name: Resolve the .NET SDK version
      id: resolve-sdk
      shell: bash
      run: |
        python3 - <<'PY'
        import json
        import os
        import sys
        import urllib.request

        # actions/setup-dotnet routes channel installs through aka.ms, whose
        # redirect origin is not always reachable. Resolve the exact SDK from the
        # official release metadata so dotnet-install uses the direct
        # builds.dotnet.microsoft.com feed while global.json keeps owning the
        # roll-forward policy.
        index_url = "https://builds.dotnet.microsoft.com/dotnet/release-metadata/releases-index.json"

        def fetch(url):
            with urllib.request.urlopen(url, timeout=30) as response:
                return json.load(response)

        def version_key(value):
            return tuple(int(part) for part in value.split("-", 1)[0].split("."))

        with open("global.json", encoding="utf-8") as stream:
            sdk = json.load(stream)["sdk"]

        version = sdk["version"]
        roll_forward = sdk.get("rollForward", "disable")
        allow_prerelease = sdk.get("allowPrerelease", True)
        if "-" in version:
            roll_forward = "disable"

        major, minor = version.split(".")[:2]
        feature_digit = version.split(".")[2][0]
        entries = fetch(index_url)["releases-index"]

        if roll_forward == "disable":
            resolved = version
        elif roll_forward == "latestFeature":
            resolved = next(
                (entry["latest-sdk"] for entry in entries if entry["channel-version"] == f"{major}.{minor}"),
                None,
            )
        elif roll_forward == "latestPatch":
            releases = fetch(f"https://builds.dotnet.microsoft.com/dotnet/release-metadata/{major}.{minor}/releases.json")["releases"]
            candidates = [
                release["sdk"]["version"]
                for release in releases
                if release["sdk"]["version"].startswith(f"{major}.{minor}.{feature_digit}")
            ]
            resolved = max(candidates, key=version_key) if candidates else None
        elif roll_forward == "latestMinor":
            matching = [entry for entry in entries if entry["channel-version"].startswith(f"{major}.")]
            resolved = (
                max(matching, key=lambda entry: version_key(entry["channel-version"]))["latest-sdk"]
                if matching
                else None
            )
        elif roll_forward == "latestMajor":
            stable = [entry for entry in entries if "-" not in entry["latest-sdk"]]
            resolved = (
                max(stable, key=lambda entry: version_key(entry["latest-sdk"]))["latest-sdk"]
                if stable
                else None
            )
        else:
            resolved = version

        if not resolved:
            print(f"::error::Unable to resolve a stable .NET SDK for global.json version {version} (rollForward: {roll_forward}).")
            sys.exit(1)
        if not allow_prerelease and "-" in resolved:
            print(f"::error::Resolved SDK {resolved} is a prerelease but global.json sets allowPrerelease: false.")
            sys.exit(1)

        print(f"Resolved .NET SDK {resolved} for global.json version {version} (rollForward: {roll_forward}).")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"version={resolved}\n")
        PY
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        # An exact version makes dotnet-install bypass the aka.ms redirect and
        # download from builds.dotnet.microsoft.com. setup-dotnet still manages
        # the NuGet cache for the restored projects.
        dotnet-version: ${{ steps.resolve-sdk.outputs.version }}
        cache: true
        cache-dependency-path: |
          global.json
          Directory.*.props
          Directory.*.targets
          **/*.csproj
          NuGet.config
    - name: Install Aspire
      shell: bash
      run: |
        dotnet tool install Aspire.Cli --version "$ASPIRE_VERSION" --tool-path "$RUNNER_TEMP/aspire"
        echo "$RUNNER_TEMP/aspire" >> "$GITHUB_PATH"
