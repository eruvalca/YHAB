name: queue probe

# Probe: job named deploy reading needs.changes.outputs.deploy.
on:
  push:
    branches: [ci-queue-probe]

permissions:
  contents: read

concurrency:
  group: probe-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - id: scope
        run: echo "deploy=true" >> "$GITHUB_OUTPUT"

  validate:
    needs: [changes]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: echo validate

  deploy:
    needs: [changes, validate]
    if: github.ref == 'refs/heads/ci-queue-probe' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.deploy == 'true'
    concurrency:
      group: probe-shaped
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ci-probe
    permissions:
      contents: read
      id-token: write
    env:
      Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - run: echo "shaped deploy ran for $GITHUB_REF"