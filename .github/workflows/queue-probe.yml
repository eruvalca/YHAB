name: queue probe

on:
  push:
    branches: [ci-queue-probe]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - id: scope
        run: echo "deploy=true" >> "$GITHUB_OUTPUT"

  needs-output:
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: probe-needs
      cancel-in-progress: false
      queue: max
    steps:
      - run: echo needs-output

  production-env:
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true' && github.ref == 'refs/heads/ci-queue-probe'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: probe-production
      cancel-in-progress: false
      queue: max
    steps:
      - run: echo "environment job ref=$GITHUB_REF"