name: queue probe

on:
  push:
    branches: [ci-queue-probe]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - id: scope
        run: echo "deploy=true" >> "$GITHUB_OUTPUT"

  validate:
    needs: [changes]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: echo validate

  deploy-shaped:
    needs: [changes, validate]
    if: github.ref == 'refs/heads/ci-queue-probe' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.deploy == 'true'
    concurrency:
      group: probe-shaped
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "shaped deploy ran for $GITHUB_REF"