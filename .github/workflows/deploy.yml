name: Validate and deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  # Browser validation is opt-in and runs only in the request workflow.
  merge_group:

permissions:
  contents: read

concurrency:
  # PR updates share the PR-ref group so a new push cancels the stale run.
  # Main pushes and merge groups stay independent.
  group: yhab-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASPIRE_VERSION: 13.6.2

jobs:
  changes:
    name: Select validation scope
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      application: ${{ steps.scope.outputs.application }}
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Classify changed paths
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ($env:EVENT_NAME -ne 'pull_request') {
            $scope = ./scripts/Get-ValidationScope.ps1 -Full
          }
          else {
            $encodedFiles = @(gh api --paginate "repos/$env:GH_REPO/pulls/$env:PR_NUMBER/files?per_page=100" --jq '.[] | { filename, previous_filename } | @json')
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            if ($encodedFiles.Count -ge 3000) {
              $scope = ./scripts/Get-ValidationScope.ps1 -Full
            }
            else {
              $files = @($encodedFiles | ForEach-Object { $_ | ConvertFrom-Json })
              $paths = @($files | ForEach-Object { $_.filename; $_.previous_filename } | Where-Object { $null -ne $_ })
              $scope = ./scripts/Get-ValidationScope.ps1 -Paths $paths
            }
          }
          "application=$($scope.application.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "deploy=$($scope.deploy.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  fast:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Check formatting
        run: dotnet format YHAB.slnx --severity warn --verify-no-changes
      - name: Check workflow selection and documentation hooks
        shell: pwsh
        run: |
          ./scripts/Test-ValidationScope.ps1
          ./scripts/Test-BrowserWorkflowPolicy.ps1
          ./scripts/Test-NightlyValidationIssue.ps1
          ./scripts/Test-DocumentationReviewHook.ps1
          ./scripts/Test-AgentValidationHook.ps1
      - name: Check project-reference policy
        shell: pwsh
        run: ./scripts/Test-ArchitectureProjectReferences.ps1
      - name: Check architecture before optimization
        if: needs.changes.outputs.application == 'true'
        run: dotnet test --project tests/YHAB.UnitTests/YHAB.UnitTests.csproj --configuration Debug --filter-class "YHAB.UnitTests.Architecture.*" --report-trx --report-trx-filename architecture-debug.trx --results-directory "${{ runner.temp }}/yhab-test-results"
      - name: Build
        if: needs.changes.outputs.application == 'true'
        run: dotnet build YHAB.slnx --configuration Release
      - name: Test unit and component layers
        if: needs.changes.outputs.application == 'true'
        shell: pwsh
        run: |
          foreach ($project in @('YHAB.UnitTests', 'YHAB.ComponentTests')) {
            dotnet test --project "tests/$project/$project.csproj" --configuration Release --no-build --report-trx --results-directory "$env:RUNNER_TEMP/yhab-test-results"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Retain test results
        if: needs.changes.outputs.application == 'true' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-fast
          path: ${{ runner.temp }}/yhab-test-results/*.trx
          retention-days: 7
          if-no-files-found: warn

  tests:
    name: Test ${{ matrix.project }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        project: [YHAB.IntegrationTests, YHAB.AspireIntegrationTests]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - if: needs.changes.outputs.application == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: needs.changes.outputs.application == 'true'
        uses: ./.github/actions/setup-dotnet
      - name: Create and trust test HTTPS certificate
        if: needs.changes.outputs.application == 'true' && matrix.project == 'YHAB.AspireIntegrationTests'
        uses: ./.github/actions/trust-test-cert
      - name: Build test project
        if: needs.changes.outputs.application == 'true'
        shell: pwsh
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          dotnet build "tests/$env:PROJECT/$env:PROJECT.csproj" --configuration Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run tests
        if: needs.changes.outputs.application == 'true'
        shell: pwsh
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          dotnet test --project "tests/$env:PROJECT/$env:PROJECT.csproj" --configuration Release --no-build --max-parallel-test-modules 1 --output Detailed --report-trx --results-directory "$env:RUNNER_TEMP/yhab-test-results"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain test results
        if: needs.changes.outputs.application == 'true' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.project }}
          path: ${{ runner.temp }}/yhab-test-results/*.trx
          retention-days: 7
          if-no-files-found: warn

  publish:
    name: Validate deployment artifacts
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Validate deployment artifacts and migration bundle
        run: aspire publish --environment Production --output-path "$RUNNER_TEMP/yhab-preview" --non-interactive

  deploy:
    needs: [fast, tests, publish]
    # Every successful main push deploys; pull requests never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      Azure__TenantId: ${{ vars.AZURE_TENANT_ID }}
      Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__CredentialSource: AzureCli
      Azure__AllowResourceGroupCreation: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure, apply migrations, then deploy web
        run: aspire deploy --environment Production --non-interactive
      - name: Verify deployed application
        shell: bash
        run: |
          host=$(az containerapp show --resource-group "$Azure__ResourceGroup" --name yhab --query properties.configuration.ingress.fqdn --output tsv)
          test -n "$host"
          for path in /alive /health /Account/Login; do
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 "https://$host$path" --output /dev/null
          done
          echo "Application: https://$host" >> "$GITHUB_STEP_SUMMARY"