name: Validate and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      performance:
        description: Also run extended browser load and memory diagnostics
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: yhab-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASPIRE_VERSION: 13.6.0

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      application: ${{ steps.scope.outputs.application }}
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Select validation scope
        id: scope
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $paths = @()
          $full = $env:EVENT -in @('workflow_dispatch', 'schedule')
          if (!$full) {
            $base = $env:BASE
            if (!$base -or $base -match '^0+$') { $full = $true }
            else {
              if ($env:EVENT -eq 'pull_request') {
                $base = git merge-base $base HEAD
                if ($LASTEXITCODE) { throw 'Cannot determine PR merge base.' }
              }
              $diff = git diff --name-only --no-renames -z $base HEAD
              if ($LASTEXITCODE) { throw 'Cannot determine changed paths.' }
              $paths = @(($diff -join "`n").Split([char]0, [StringSplitOptions]::RemoveEmptyEntries))
            }
          }
          $scope = ./scripts/Get-ValidationScope.ps1 -Paths $paths -Full:$full
          "application=$($scope.application.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "deploy=$($scope.deploy.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  fast:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Check formatting
        run: dotnet format YHAB.slnx --severity warn --verify-no-changes
      - name: Check workflow selection and documentation hooks
        shell: pwsh
        run: |
          ./scripts/Test-ValidationScope.ps1
          ./scripts/Test-DocumentationReviewHook.ps1
          ./scripts/Test-AgentValidationHook.ps1
      - name: Check project-reference policy
        if: needs.changes.outputs.application == 'true'
        shell: pwsh
        run: ./scripts/Test-ArchitectureProjectReferences.ps1
      - name: Check architecture before optimization
        if: needs.changes.outputs.application == 'true'
        run: dotnet test --project tests/YHAB.UnitTests/YHAB.UnitTests.csproj --configuration Debug --filter-class "YHAB.UnitTests.Architecture.*" --report-trx --report-trx-filename architecture-debug.trx --results-directory "${{ runner.temp }}/yhab-test-results"
      - name: Build
        if: needs.changes.outputs.application == 'true'
        run: dotnet build YHAB.slnx --configuration Release
      - name: Test unit and component layers
        if: needs.changes.outputs.application == 'true'
        shell: pwsh
        run: |
          foreach ($project in @('YHAB.UnitTests', 'YHAB.ComponentTests')) {
            dotnet test --project "tests/$project/$project.csproj" --configuration Release --no-build --report-trx --results-directory "$env:RUNNER_TEMP/yhab-test-results"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-fast
          path: ${{ runner.temp }}/yhab-test-results/*.trx
          retention-days: 7
          if-no-files-found: warn

  tests:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    strategy:
      fail-fast: false
      matrix:
        project: [YHAB.IntegrationTests, YHAB.AspireIntegrationTests, YHAB.PlaywrightTests]
    uses: ./.github/workflows/test-layer.yml
    with:
      project: ${{ matrix.project }}

  diagnostics:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.performance)
    uses: ./.github/workflows/test-layer.yml
    with:
      project: YHAB.PlaywrightTests
      performance: true

  publish:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Validate deployment artifacts and migration bundle
        run: aspire publish --environment Production --output-path "$RUNNER_TEMP/yhab-preview" --non-interactive

  validate:
    needs: [changes, fast, tests, publish, diagnostics]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable check to succeed
        shell: pwsh
        env:
          NEEDS: ${{ toJSON(needs) }}
          PERFORMANCE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.performance) }}
        run: |
          $jobs = $env:NEEDS | ConvertFrom-Json
          $required = @('changes', 'fast')
          if ($jobs.changes.outputs.application -eq 'true') { $required += @('tests', 'publish') }
          if ($env:PERFORMANCE -eq 'true') { $required += 'diagnostics' }
          foreach ($name in $required) {
            if ($jobs.$name.result -ne 'success') { throw "$name did not succeed: $($jobs.$name.result)" }
          }

  deploy:
    needs: [changes, validate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.deploy == 'true'
    concurrency:
      group: yhab-production
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      Azure__TenantId: ${{ vars.AZURE_TENANT_ID }}
      Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__CredentialSource: AzureCli
      Azure__AllowResourceGroupCreation: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reject superseded application changes
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          if ($LASTEXITCODE) { throw 'Cannot fetch current main.' }
          $currentMain = git rev-parse FETCH_HEAD
          if ($LASTEXITCODE) { throw 'Cannot resolve current main.' }
          if ($currentMain -ne $env:GITHUB_SHA) {
            $diff = git diff --name-only --no-renames -z $env:GITHUB_SHA $currentMain
            if ($LASTEXITCODE) { throw 'Cannot compare deployment inputs.' }
            $paths = @(($diff -join "`n").Split([char]0, [StringSplitOptions]::RemoveEmptyEntries))
            $scope = ./scripts/Get-ValidationScope.ps1 -Paths $paths
            if ($scope.deploy) { throw 'Application changes superseded this commit. Deploy the newer workflow run.' }
            Write-Host 'Only non-deployment files changed on main; deploying the validated application commit.'
          }
      - uses: ./.github/actions/setup-dotnet
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure, apply migrations, then deploy web
        run: aspire deploy --environment Production --non-interactive
      - name: Verify deployed application
        shell: bash
        run: |
          host=$(az containerapp show --resource-group "$Azure__ResourceGroup" --name yhab --query properties.configuration.ingress.fqdn --output tsv)
          test -n "$host"
          for path in /alive /health /Account/Login; do
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 "https://$host$path" --output /dev/null
          done
          echo "Application: https://$host" >> "$GITHUB_STEP_SUMMARY"
