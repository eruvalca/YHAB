name: Validate and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: yhab-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASPIRE_VERSION: 13.6.0

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Check formatting
        run: dotnet format YHAB.slnx --severity warn --verify-no-changes
      - name: Check workflow selection and documentation hooks
        shell: pwsh
        run: |
          ./scripts/Test-ValidationScope.ps1
          ./scripts/Test-DocumentationReviewHook.ps1
          ./scripts/Test-AgentValidationHook.ps1
      - name: Check project-reference policy
        shell: pwsh
        run: ./scripts/Test-ArchitectureProjectReferences.ps1
      - name: Check architecture before optimization
        run: dotnet test --project tests/YHAB.UnitTests/YHAB.UnitTests.csproj --configuration Debug --filter-class "YHAB.UnitTests.Architecture.*" --report-trx --report-trx-filename architecture-debug.trx --results-directory "${{ runner.temp }}/yhab-test-results"
      - name: Build
        run: dotnet build YHAB.slnx --configuration Release
      - name: Test unit and component layers
        shell: pwsh
        run: |
          foreach ($project in @('YHAB.UnitTests', 'YHAB.ComponentTests')) {
            dotnet test --project "tests/$project/$project.csproj" --configuration Release --no-build --report-trx --results-directory "$env:RUNNER_TEMP/yhab-test-results"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-fast
          path: ${{ runner.temp }}/yhab-test-results/*.trx
          retention-days: 7
          if-no-files-found: warn

  tests:
    name: Test ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        project: [YHAB.IntegrationTests, YHAB.AspireIntegrationTests, YHAB.PlaywrightTests]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Create and trust test HTTPS certificate
        if: matrix.project != 'YHAB.IntegrationTests'
        uses: ./.github/actions/trust-test-cert
      - name: Build test project
        shell: pwsh
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          dotnet build "tests/$env:PROJECT/$env:PROJECT.csproj" --configuration Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install test browser
        if: matrix.project == 'YHAB.PlaywrightTests'
        shell: pwsh
        run: ./tests/YHAB.PlaywrightTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run tests
        shell: pwsh
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          dotnet test --project "tests/$env:PROJECT/$env:PROJECT.csproj" --configuration Release --no-build --max-parallel-test-modules 1 --output Detailed --filter-not-trait Category=Performance --report-trx --results-directory "$env:RUNNER_TEMP/yhab-test-results"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.project }}
          path: ${{ runner.temp }}/yhab-test-results/*.trx
          retention-days: 7
          if-no-files-found: warn
      - name: Retain browser failure diagnostics
        if: failure() && matrix.project == 'YHAB.PlaywrightTests'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics
          path: |
            tests/YHAB.PlaywrightTests/bin/Release/net10.0/TestResults/**/trace.zip
            tests/YHAB.PlaywrightTests/bin/Release/net10.0/TestResults/**/*.png
          retention-days: 7
          if-no-files-found: warn

  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Validate deployment artifacts and migration bundle
        run: aspire publish --environment Production --output-path "$RUNNER_TEMP/yhab-preview" --non-interactive

  deploy:
    needs: [fast, tests, publish]
    # Every successful main push deploys; pull requests never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      Azure__TenantId: ${{ vars.AZURE_TENANT_ID }}
      Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__CredentialSource: AzureCli
      Azure__AllowResourceGroupCreation: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure, apply migrations, then deploy web
        run: aspire deploy --environment Production --non-interactive
      - name: Verify deployed application
        shell: bash
        run: |
          host=$(az containerapp show --resource-group "$Azure__ResourceGroup" --name yhab --query properties.configuration.ingress.fqdn --output tsv)
          test -n "$host"
          for path in /alive /health /Account/Login; do
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 "https://$host$path" --output /dev/null
          done
          echo "Application: https://$host" >> "$GITHUB_STEP_SUMMARY"