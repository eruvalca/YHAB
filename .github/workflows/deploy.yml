name: Validate and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yhab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASPIRE_VERSION: 13.6.0

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Install Aspire
        shell: bash
        run: |
          dotnet tool install Aspire.Cli --version "$ASPIRE_VERSION" --tool-path "$RUNNER_TEMP/aspire"
          echo "$RUNNER_TEMP/aspire" >> "$GITHUB_PATH"
      - name: Create and trust test HTTPS certificate
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libnss3-tools
          # Aspire's HTTPS readiness probes use the runner's OpenSSL trust store.
          # Export only the public certificate from the same user that runs tests.
          dotnet dev-certs https --export-path "$RUNNER_TEMP/yhab-test-https.crt" --format PEM
          sudo cp "$RUNNER_TEMP/yhab-test-https.crt" /usr/local/share/ca-certificates/yhab-test-https.crt
          sudo update-ca-certificates
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/yhab-test-https.crt"
          # Chromium's service-worker fetches also require NSS trust. Context-level
          # IgnoreHTTPSErrors does not cover them. M146+ uses this new default path,
          # unless a legacy database already exists for the same runner user.
          nssdb="$HOME/.local/share/pki/nssdb"
          if [[ -d "$HOME/.pki/nssdb" ]]; then nssdb="$HOME/.pki/nssdb"; fi
          mkdir -p "$nssdb"
          if [[ ! -f "$nssdb/cert9.db" ]]; then
            certutil -N -d "sql:$nssdb" --empty-password
          fi
          certutil -A -d "sql:$nssdb" -n yhab-test-https -t 'P,,' -i "$RUNNER_TEMP/yhab-test-https.crt"
          certutil -V -d "sql:$nssdb" -n yhab-test-https -u V
      - name: Check formatting
        run: dotnet format YHAB.slnx --severity warn --verify-no-changes
      - name: Build
        run: dotnet build YHAB.slnx --configuration Release
      - name: Install test browser
        shell: pwsh
        run: ./tests/YHAB.PlaywrightTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Test all layers with isolated resources
        run: dotnet test --solution YHAB.slnx --configuration Release --no-build --max-parallel-test-modules 1 --output Detailed --report-trx --results-directory "${{ runner.temp }}/yhab-test-results"
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: ${{ runner.temp }}/yhab-test-results/*.trx
          retention-days: 7
          if-no-files-found: warn
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: |
            tests/YHAB.PlaywrightTests/bin/Release/net10.0/TestResults/**/trace.zip
            tests/YHAB.PlaywrightTests/bin/Release/net10.0/TestResults/**/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Validate deployment artifacts and migration bundle
        run: aspire publish --environment Production --output-path "$RUNNER_TEMP/yhab-preview" --non-interactive

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      Azure__TenantId: ${{ vars.AZURE_TENANT_ID }}
      Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__CredentialSource: AzureCli
      Azure__AllowResourceGroupCreation: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify this is still the latest main commit
        shell: bash
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "This commit has been superseded on main. Deploy the newer workflow run."
            exit 1
          fi
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Install Aspire
        shell: bash
        run: |
          dotnet tool install Aspire.Cli --version "$ASPIRE_VERSION" --tool-path "$RUNNER_TEMP/aspire"
          echo "$RUNNER_TEMP/aspire" >> "$GITHUB_PATH"
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure, apply migrations, then deploy web
        run: aspire deploy --environment Production --non-interactive
      - name: Verify deployed application
        shell: bash
        run: |
          host=$(az containerapp show --resource-group "$Azure__ResourceGroup" --name yhab --query properties.configuration.ingress.fqdn --output tsv)
          test -n "$host"
          for path in /alive /health /Account/Login; do
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 "https://$host$path" --output /dev/null
          done
          echo "Application: https://$host" >> "$GITHUB_STEP_SUMMARY"
