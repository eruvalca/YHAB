name: Validate and deploy

on:
  pull_request:
    # `labeled` lets an author opt into the full browser suite. Label events
    # re-run this workflow; the gate ignores a skipped full-suite rerun and
    # reuses the last completed result for the same commit.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  # The merge queue runs the full browser suite on the combined merge group.
  merge_group:

permissions:
  contents: read
  checks: read

concurrency:
  # Ordinary PR updates share the PR-ref group so a new push cancels the stale
  # run. Main pushes, merge groups, and label events get run-specific groups so
  # each validation/deployment run stays independent.
  group: yhab-${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.action != 'labeled') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASPIRE_VERSION: 13.6.2

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Check formatting
        run: dotnet format YHAB.slnx --severity warn --verify-no-changes
      - name: Check workflow selection and documentation hooks
        shell: pwsh
        run: |
          ./scripts/Test-ValidationScope.ps1
          ./scripts/Test-DocumentationReviewHook.ps1
          ./scripts/Test-AgentValidationHook.ps1
      - name: Check project-reference policy
        shell: pwsh
        run: ./scripts/Test-ArchitectureProjectReferences.ps1
      - name: Check architecture before optimization
        run: dotnet test --project tests/YHAB.UnitTests/YHAB.UnitTests.csproj --configuration Debug --filter-class "YHAB.UnitTests.Architecture.*" --report-trx --report-trx-filename architecture-debug.trx --results-directory "${{ runner.temp }}/yhab-test-results"
      - name: Build
        run: dotnet build YHAB.slnx --configuration Release
      - name: Test unit and component layers
        shell: pwsh
        run: |
          foreach ($project in @('YHAB.UnitTests', 'YHAB.ComponentTests')) {
            dotnet test --project "tests/$project/$project.csproj" --configuration Release --no-build --report-trx --results-directory "$env:RUNNER_TEMP/yhab-test-results"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-fast
          path: ${{ runner.temp }}/yhab-test-results/*.trx
          retention-days: 7
          if-no-files-found: warn

  tests:
    name: Test ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        project: [YHAB.IntegrationTests, YHAB.AspireIntegrationTests]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Create and trust test HTTPS certificate
        if: matrix.project == 'YHAB.AspireIntegrationTests'
        uses: ./.github/actions/trust-test-cert
      - name: Build test project
        shell: pwsh
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          dotnet build "tests/$env:PROJECT/$env:PROJECT.csproj" --configuration Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run tests
        shell: pwsh
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          dotnet test --project "tests/$env:PROJECT/$env:PROJECT.csproj" --configuration Release --no-build --max-parallel-test-modules 1 --output Detailed --report-trx --results-directory "$env:RUNNER_TEMP/yhab-test-results"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.project }}
          path: ${{ runner.temp }}/yhab-test-results/*.trx
          retention-days: 7
          if-no-files-found: warn

  browser-smoke:
    name: Browser smoke
    # Drafts do not need a browser run; marking a PR ready triggers one.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Create and trust test HTTPS certificate
        uses: ./.github/actions/trust-test-cert
      - name: Build test project
        shell: pwsh
        run: |
          dotnet build "tests/YHAB.PlaywrightTests/YHAB.PlaywrightTests.csproj" --configuration Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: ./.github/actions/install-playwright-browser
      - name: Run browser smoke cases
        shell: pwsh
        run: |
          dotnet test --project "tests/YHAB.PlaywrightTests/YHAB.PlaywrightTests.csproj" --configuration Release --no-build --max-parallel-test-modules 1 --output Detailed --filter-trait Category=BrowserSmoke --report-trx --results-directory "$env:RUNNER_TEMP/yhab-test-results"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-browser-smoke
          path: ${{ runner.temp }}/yhab-test-results/*.trx
          retention-days: 7
          if-no-files-found: warn
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-smoke
          path: |
            tests/YHAB.PlaywrightTests/bin/Release/net10.0/TestResults/**/trace.zip
            tests/YHAB.PlaywrightTests/bin/Release/net10.0/TestResults/**/*.png
          retention-days: 7
          if-no-files-found: warn

  browser-full:
    name: Browser full suite
    # Pull requests opt in when the `run-full-browser` label is applied. The
    # merge queue and every main push always run the full suite as the post-merge
    # net. Re-apply the label after a new commit to validate that commit.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'run-full-browser' &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Create and trust test HTTPS certificate
        uses: ./.github/actions/trust-test-cert
      - name: Build test project
        shell: pwsh
        run: |
          dotnet build "tests/YHAB.PlaywrightTests/YHAB.PlaywrightTests.csproj" --configuration Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: ./.github/actions/install-playwright-browser
      - name: Run browser cases
        shell: pwsh
        run: |
          dotnet test --project "tests/YHAB.PlaywrightTests/YHAB.PlaywrightTests.csproj" --configuration Release --no-build --max-parallel-test-modules 1 --output Detailed --filter-not-trait Category=Performance --report-trx --results-directory "$env:RUNNER_TEMP/yhab-test-results"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-browser-full
          path: ${{ runner.temp }}/yhab-test-results/*.trx
          retention-days: 7
          if-no-files-found: warn
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-full
          path: |
            tests/YHAB.PlaywrightTests/bin/Release/net10.0/TestResults/**/trace.zip
            tests/YHAB.PlaywrightTests/bin/Release/net10.0/TestResults/**/*.png
          retention-days: 7
          if-no-files-found: warn

  browser-gate:
    name: Browser validation gate
    needs: [browser-full]
    # Native merge queue is unavailable for a public repository owned by a user
    # account. This gate gives the same guarantee: the full suite must have
    # passed on this exact commit before merging. It also runs on merge_group so
    # the same required check keeps working if native merge queue is enabled.
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm the full browser suite passed for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_RESULT: ${{ needs.browser-full.result }}
        run: |
          set -euo pipefail
          if [ "$FULL_RESULT" = "success" ]; then
            echo "Full browser suite passed in this run."
            exit 0
          fi
          conclusion=""
          if [ -n "${HEAD_SHA:-}" ]; then
            conclusion=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs?check_name=Browser%20full%20suite&per_page=100" \
              --jq '[.check_runs[] | select(.name == "Browser full suite" and .conclusion != null and .conclusion != "skipped" and .conclusion != "neutral")] | sort_by(.completed_at // .started_at) | last | .conclusion // ""' 2>/dev/null || true)
          fi
          if [ "$conclusion" = "success" ]; then
            echo "Full browser suite already passed for $HEAD_SHA."
            exit 0
          fi
          echo "::error::The full browser suite has not passed for this commit. Apply the 'run-full-browser' label (or remove and re-apply it after a new commit) and wait for it to pass before merging."
          exit 1

  publish:
    name: Validate deployment artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Validate deployment artifacts and migration bundle
        run: aspire publish --environment Production --output-path "$RUNNER_TEMP/yhab-preview" --non-interactive

  deploy:
    needs: [fast, tests, browser-full, publish]
    # Every successful main push deploys; pull requests never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      Azure__TenantId: ${{ vars.AZURE_TENANT_ID }}
      Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__CredentialSource: AzureCli
      Azure__AllowResourceGroupCreation: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure, apply migrations, then deploy web
        run: aspire deploy --environment Production --non-interactive
      - name: Verify deployed application
        shell: bash
        run: |
          host=$(az containerapp show --resource-group "$Azure__ResourceGroup" --name yhab --query properties.configuration.ingress.fqdn --output tsv)
          test -n "$host"
          for path in /alive /health /Account/Login; do
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 "https://$host$path" --output /dev/null
          done
          echo "Application: https://$host" >> "$GITHUB_STEP_SUMMARY"