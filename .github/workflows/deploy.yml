name: Validate and deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # The merge queue runs the full browser suite on the combined merge group.
  merge_group:

permissions:
  contents: read

concurrency:
  # PR updates share the PR-ref group so a new push cancels the stale run.
  # Main pushes and merge groups stay independent.
  group: yhab-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASPIRE_VERSION: 13.6.2

jobs:
  changes:
    name: Select validation scope
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      application: ${{ steps.scope.outputs.application }}
      deploy: ${{ steps.scope.outputs.deploy }}
      browser: ${{ steps.scope.outputs.browser }}
      browser-requested: ${{ steps.scope.outputs.browser-requested }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Classify changed paths
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-browser') }}
        run: |
          if ($env:EVENT_NAME -ne 'pull_request') {
            $scope = ./scripts/Get-ValidationScope.ps1 -Full
          }
          else {
            $paths = @(gh api --paginate "repos/$env:GH_REPO/pulls/$env:PR_NUMBER/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $scope = ./scripts/Get-ValidationScope.ps1 -Paths $paths
            if ($env:IS_DRAFT -eq 'true') {
              $scope.browser = 'none'
            }
          }
          $requested = if ($env:FULL_LABEL -eq 'true') { 'full' } else { $scope.browser }
          "application=$($scope.application.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "deploy=$($scope.deploy.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "browser=$($scope.browser)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "browser-requested=$requested" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  fast:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Check formatting
        run: dotnet format YHAB.slnx --severity warn --verify-no-changes
      - name: Check workflow selection and documentation hooks
        shell: pwsh
        run: |
          ./scripts/Test-ValidationScope.ps1
          ./scripts/Test-BrowserValidationGate.ps1
          ./scripts/Test-DocumentationReviewHook.ps1
          ./scripts/Test-AgentValidationHook.ps1
      - name: Check project-reference policy
        shell: pwsh
        run: ./scripts/Test-ArchitectureProjectReferences.ps1
      - name: Check architecture before optimization
        if: needs.changes.outputs.application == 'true'
        run: dotnet test --project tests/YHAB.UnitTests/YHAB.UnitTests.csproj --configuration Debug --filter-class "YHAB.UnitTests.Architecture.*" --report-trx --report-trx-filename architecture-debug.trx --results-directory "${{ runner.temp }}/yhab-test-results"
      - name: Build
        if: needs.changes.outputs.application == 'true'
        run: dotnet build YHAB.slnx --configuration Release
      - name: Test unit and component layers
        if: needs.changes.outputs.application == 'true'
        shell: pwsh
        run: |
          foreach ($project in @('YHAB.UnitTests', 'YHAB.ComponentTests')) {
            dotnet test --project "tests/$project/$project.csproj" --configuration Release --no-build --report-trx --results-directory "$env:RUNNER_TEMP/yhab-test-results"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Retain test results
        if: needs.changes.outputs.application == 'true' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-fast
          path: ${{ runner.temp }}/yhab-test-results/*.trx
          retention-days: 7
          if-no-files-found: warn

  tests:
    name: Test ${{ matrix.project }}
    needs: changes
    if: needs.changes.outputs.application == 'true'
    strategy:
      fail-fast: false
      matrix:
        project: [YHAB.IntegrationTests, YHAB.AspireIntegrationTests]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Create and trust test HTTPS certificate
        if: matrix.project == 'YHAB.AspireIntegrationTests'
        uses: ./.github/actions/trust-test-cert
      - name: Build test project
        shell: pwsh
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          dotnet build "tests/$env:PROJECT/$env:PROJECT.csproj" --configuration Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run tests
        shell: pwsh
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          dotnet test --project "tests/$env:PROJECT/$env:PROJECT.csproj" --configuration Release --no-build --max-parallel-test-modules 1 --output Detailed --report-trx --results-directory "$env:RUNNER_TEMP/yhab-test-results"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.project }}
          path: ${{ runner.temp }}/yhab-test-results/*.trx
          retention-days: 7
          if-no-files-found: warn

  browser-smoke:
    name: Browser smoke
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.browser == 'smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Create and trust test HTTPS certificate
        uses: ./.github/actions/trust-test-cert
      - name: Build test project
        shell: pwsh
        run: |
          dotnet build "tests/YHAB.PlaywrightTests/YHAB.PlaywrightTests.csproj" --configuration Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: ./.github/actions/install-playwright-browser
      - name: Run browser smoke cases
        shell: pwsh
        run: |
          dotnet test --project "tests/YHAB.PlaywrightTests/YHAB.PlaywrightTests.csproj" --configuration Release --no-build --max-parallel-test-modules 1 --output Detailed --filter-trait Category=BrowserSmoke --report-trx --results-directory "$env:RUNNER_TEMP/yhab-test-results"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-browser-smoke
          path: ${{ runner.temp }}/yhab-test-results/*.trx
          retention-days: 7
          if-no-files-found: warn
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-smoke
          path: |
            tests/YHAB.PlaywrightTests/bin/Release/net10.0/TestResults/**/trace.zip
            tests/YHAB.PlaywrightTests/bin/Release/net10.0/TestResults/**/*.png
          retention-days: 7
          if-no-files-found: warn

  browser-full:
    name: Browser full suite
    needs: changes
    # Browser-affecting paths require this suite. The label can additionally
    # request it for any PR and remains effective on subsequent commits.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       needs.changes.outputs.browser-requested == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/run-full-browser

  browser-gate:
    name: Browser validation gate
    needs: [changes, browser-smoke, browser-full]
    # The required gate follows the selected tier. A label-requested full run is
    # additional evidence and does not replace a PR's required smoke coverage.
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Confirm the selected browser validation passed
        shell: pwsh
        env:
          BROWSER_SCOPE: ${{ needs.changes.outputs.browser }}
          SMOKE_RESULT: ${{ needs.browser-smoke.result }}
          FULL_RESULT: ${{ needs.browser-full.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/Confirm-BrowserValidation.ps1 -Scope $env:BROWSER_SCOPE -SmokeResult $env:SMOKE_RESULT -FullResult $env:FULL_RESULT -RunUrl $env:RUN_URL

  publish:
    name: Validate deployment artifacts
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - name: Validate deployment artifacts and migration bundle
        run: aspire publish --environment Production --output-path "$RUNNER_TEMP/yhab-preview" --non-interactive

  deploy:
    needs: [fast, tests, browser-full, publish]
    # Every successful main push deploys; pull requests never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      Azure__TenantId: ${{ vars.AZURE_TENANT_ID }}
      Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__CredentialSource: AzureCli
      Azure__AllowResourceGroupCreation: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure, apply migrations, then deploy web
        run: aspire deploy --environment Production --non-interactive
      - name: Verify deployed application
        shell: bash
        run: |
          host=$(az containerapp show --resource-group "$Azure__ResourceGroup" --name yhab --query properties.configuration.ingress.fqdn --output tsv)
          test -n "$host"
          for path in /alive /health /Account/Login; do
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 "https://$host$path" --output /dev/null
          done
          echo "Application: https://$host" >> "$GITHUB_STEP_SUMMARY"