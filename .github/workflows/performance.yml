name: Performance validation

on:
  schedule:
    # Weekly on Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yhab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASPIRE_VERSION: 13.6.0

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/trust-test-cert
      - name: Build Playwright test project
        shell: pwsh
        run: |
          dotnet build "tests/YHAB.PlaywrightTests/YHAB.PlaywrightTests.csproj" --configuration Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install test browser
        shell: pwsh
        run: ./tests/YHAB.PlaywrightTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run performance cases
        shell: pwsh
        run: |
          dotnet test --project "tests/YHAB.PlaywrightTests/YHAB.PlaywrightTests.csproj" --configuration Release --no-build --max-parallel-test-modules 1 --output Detailed --filter-trait Category=Performance --report-trx --results-directory "$env:RUNNER_TEMP/yhab-test-results"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-performance
          path: ${{ runner.temp }}/yhab-test-results/*.trx
          retention-days: 7
          if-no-files-found: warn
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-performance
          path: |
            tests/YHAB.PlaywrightTests/bin/Release/net10.0/TestResults/**/trace.zip
            tests/YHAB.PlaywrightTests/bin/Release/net10.0/TestResults/**/*.png
          retention-days: 7
          if-no-files-found: warn
